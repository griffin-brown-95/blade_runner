# Pull new laps, rebuild the dashboard, publish site/ to GitHub Pages.
#
# The database is not kept in git (it would add a full copy to history every night).
# It lives as an asset on the "data" release: download -> ingest -> upload.
name: scrape-and-publish

on:
  schedule:
    - cron: "0 7 * * *"   # 01:00 Mountain
  workflow_dispatch:
  push:                   # editing chips.csv, the site or the metrics republishes the dashboard
    branches: [main]
    paths: [data/chips.csv, site/**, sql/**, export.py]

permissions:
  contents: write   # upload the database to the release
  pages: write
  id-token: write

concurrency:
  group: scrape
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}
  DB: data/sporthive.sqlite
  RELEASE: data

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests

      - name: Download database from release
        run: |
          if gh release view "$RELEASE" > /dev/null 2>&1; then
            gh release download "$RELEASE" -p sporthive.sqlite -D data --clobber
          elif [ -f "$DB" ]; then
            echo "No '$RELEASE' release yet; bootstrapping from the database in the repo."
            gh release create "$RELEASE" --title "Data" \
              --notes "sporthive.sqlite, updated nightly by the scrape-and-publish workflow."
          else
            echo "::error::No '$RELEASE' release and no $DB in the repo to bootstrap from." && exit 1
          fi

      - run: python ingest.py
      - run: python export.py

      - name: Upload database to release
        run: gh release upload "$RELEASE" "$DB" --clobber

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: scrape
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
